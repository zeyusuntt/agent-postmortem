[project]
name = "agent-postmortem"
version = "0.5.1"
description = "Reads the Claude Code logs already on your machine and tells you which agent's 'done' you can't trust, and what to run next."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/zeyusuntt/agent-postmortem"
Issues = "https://github.com/zeyusuntt/agent-postmortem/issues"
Changelog = "https://github.com/zeyusuntt/agent-postmortem/blob/main/CHANGELOG.md"

[project.scripts]
agent-postmortem = "agent_postmortem.entry:main"
postmortem = "agent_postmortem.entry:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_postmortem"]

# docs/DESIGN.md 8.1: a wheel built from a git checkout records its commit for --version
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "benchmark: exercises a docs/DESIGN.md 7.2 hook performance budget; kept in the default run.",
]
