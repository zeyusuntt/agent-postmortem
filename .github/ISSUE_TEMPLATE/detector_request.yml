name: Detector request
description: Propose a new failure pattern for agent-postmortem to detect.
title: "[detector]: "
labels: ["detector-request"]
body:
  - type: markdown
    attributes:
      value: |
        A good detector request pins down an observable pattern in the run
        data (journal, meta, or transcript), not just a symptom you noticed
        once. See `docs/DESIGN.md` section 4.3 for what an existing detector
        looks like and section 6 for the fixture format.
  - type: textarea
    attributes:
      label: The failure pattern
      description: What silently went wrong, and how you'd recognize it from the run data alone.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: |
        The output of `agent-postmortem run <id> --bug-report` for a run
        that shows the pattern, at the default level (redacted, no
        transcript text), plus the shape of the evidence in your own words,
        for example "the last user entry is the interrupt sentence and the
        journal has a second started event for the same key". Never paste a
        raw transcript, a `journal.jsonl` line, a real session id or an
        absolute path.
      render: markdown
    validations:
      required: false
  - type: textarea
    attributes:
      label: What rule would have prevented it
      description: If this became a suggested rule (docs/DESIGN.md section 9), what should it say?
    validations:
      required: false
