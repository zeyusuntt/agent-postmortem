name: Bug report
description: Something in agent-postmortem itself is wrong (a crash, a wrong verdict, a wrong detector).
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The most useful thing you can attach is the
        redacted bug report for the run that triggered it:

        ```
        agent-postmortem run <id> --bug-report
        ```

        Redacted: paths, ids, emails, account names, agent names. Not
        redacted: evidence lines, which are transcript excerpts quoted
        as-is. Read the whole output before posting it here, even though
        the rest is already redacted.
  - type: textarea
    attributes:
      label: What happened
      description: What you expected instead, and what you saw.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Bug report output
      description: |
        The output of `agent-postmortem run <id> --bug-report` for the run
        that shows the problem. Paths, ids, emails, account names, and
        agent names are already redacted; evidence lines are transcript
        excerpts and are not. Read it before pasting.
      render: markdown
    validations:
      required: false
  - type: input
    attributes:
      label: agent-postmortem version
      description: Output of `agent-postmortem --version`.
    validations:
      required: true
  - type: input
    attributes:
      label: Python version and OS
    validations:
      required: true
