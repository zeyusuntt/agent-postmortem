name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check this job runs the Python it names
        run: uv run python scripts/check-python-version.py ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -rs

      - name: Build
        run: uv build

      - name: Privacy check (tree and built artifacts)
        run: scripts/check-privacy.sh --tree --artifacts dist/

      - name: Validate Claude Code plugin and marketplace manifests
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict ./plugin
            claude plugin validate --strict .
          else
            echo "claude CLI not present on this runner; skipping plugin validation."
          fi
