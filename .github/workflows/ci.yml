name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Privacy check (tree and built artifacts)
        run: scripts/check-privacy.sh --tree --artifacts dist/

      - name: Validate Claude Code plugin manifest
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate ./plugin
          else
            echo "claude CLI not present on this runner; skipping plugin validation."
          fi
